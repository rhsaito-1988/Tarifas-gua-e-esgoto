name: baixar-pdfs-arespcj
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostico
        run: |
          mkdir -p fontes
          URL0="https://www.arespcj.com.br/public/media/arquivos/1734435900-resolucao_n_594_2024_-_revisao_tarifaria_-_saaeb_brotas.pdf"
          echo "== curl -v ==" > fontes/_diagnostico.txt
          curl -sS -v -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" -o /tmp/t0.pdf "$URL0" >> fontes/_diagnostico.txt 2>&1 || true
          echo "== file ==" >> fontes/_diagnostico.txt; file /tmp/t0.pdf >> fontes/_diagnostico.txt 2>&1 || true
          echo "== head ==" >> fontes/_diagnostico.txt; head -c 600 /tmp/t0.pdf >> fontes/_diagnostico.txt 2>&1 || true
          echo "== dig ==" >> fontes/_diagnostico.txt; getent hosts www.arespcj.com.br >> fontes/_diagnostico.txt 2>&1 || true
      - name: Baixar
        run: |
          python3 - <<'PY'
          import urllib.request, ssl, time, os, json
          items = json.loads(open('.github/workflows/manifest.json').read()) if os.path.exists('.github/workflows/manifest.json') else [{"name": "ARESPCJ_Resolucao_594_2024_brotas", "url": "https://www.arespcj.com.br/public/media/arquivos/1734435900-resolucao_n_594_2024_-_revisao_tarifaria_-_saaeb_brotas.pdf"}, {"name": "ARESPCJ_Resolucao_679_2025_campinas", "url": "https://www.arespcj.com.br/public/media/arquivos/1767039489-resoluo_n_679_2025_-_reajuste_tarifrio_-_campinas.pdf"}, {"name": "ARESPCJ_Resolucao_704_2026_capivari", "url": "https://www.arespcj.com.br/public/media/arquivos/1783109867-resoluo_n_704_2026_-_reajuste_tarifrio_-_saae_capivari_errata.pdf"}, {"name": "ARESPCJ_Resolucao_677_2025_catanduva", "url": "https://www.arespcj.com.br/public/media/arquivos/1772798851-resolucao_n_677_2025_-_reviso_tarifaria_-_saec_catanduva.pdf"}, {"name": "ARESPCJ_Resolucao_660_2025_cerquilho", "url": "https://www.arespcj.com.br/public/media/arquivos/1761939338-resoluo_n_660_2025_-_reajuste_tarifrio_-_cerquilho.pdf"}, {"name": "ARESPCJ_Resolucao_722_2026_conchal", "url": "https://www.arespcj.com.br/public/media/arquivos/1786712811-resoluo_n_722_2026_-_reviso_tarifria_-_conchal.pdf"}, {"name": "ARESPCJ_Resolucao_713_2026_jaboticabal", "url": "https://www.arespcj.com.br/public/media/arquivos/1784317368-resoluo_n_713_2026_-_reviso_tarifria_-_jaboticabal.pdf"}, {"name": "ARESPCJ_Resolucao_696_2026_jaguariuna", "url": "https://www.arespcj.com.br/public/media/arquivos/1782129024-resoluo_n_696_2026_-_reviso_tarifria_-_saaeja_jaguarina.pdf"}, {"name": "ARESPCJ_Resolucao_661_2025_jumirim", "url": "https://www.arespcj.com.br/public/media/arquivos/1762174265-resoluo_n_661_2025_-_reviso_tarifria_-_jumirim.pdf"}, {"name": "ARESPCJ_Resolucao_664_2025_jundiai", "url": "https://www.arespcj.com.br/public/media/arquivos/1763579795-resoluo_n_664_2025_-_reajuste_tarifrio_-_jundia.pdf"}, {"name": "ARESPCJ_Resolucao_680_2025_leme", "url": "https://www.arespcj.com.br/public/media/arquivos/1768225265-resoluo_n_680_2025_-_reajuste_tarifrio_-_leme_c.pdf"}, {"name": "ARESPCJ_Resolucao_705_2026_limeira", "url": "https://www.arespcj.com.br/public/media/arquivos/1780515925-resoluo_n_705_2026_-_reajuste_tarifrio_-_limeira_rtf.pdf"}, {"name": "ARESPCJ_Resolucao_687_2026_louveira", "url": "https://www.arespcj.com.br/public/media/arquivos/1770039048-resoluo_n_687_2026_-_reviso_tarifria_-_louveira.pdf"}, {"name": "ARESPCJ_Resolucao_675_2025_luiz-antonio", "url": "https://www.arespcj.com.br/public/media/arquivos/1766402148-resoluo_n_675_2025_-_reajuste_tarifrio_-_luiz_antnio.pdf"}, {"name": "ARESPCJ_Resolucao_640_2025_rafard", "url": "https://www.arespcj.com.br/public/media/arquivos/1753881277-resoluo_n_640_2025_-_reviso_tarifria_-_rafard.pdf"}, {"name": "ARESPCJ_Resolucao_690_2026_ribeirao-preto", "url": "https://www.arespcj.com.br/public/media/arquivos/1778174854-resoluo_n_690_2026_-_reviso_tarifria_-_ribeiro_preto_retificada.pdf"}, {"name": "ARESPCJ_Resolucao_681_2026_rio-claro", "url": "https://www.arespcj.com.br/public/media/arquivos/1768419516-resoluo_n_681_2026_-_reviso_tarifria_-_rio_claro.pdf"}, {"name": "ARESPCJ_Resolucao_637_2025_rio-das-pedras", "url": "https://www.arespcj.com.br/public/media/arquivos/1752866093-resoluo_n_637_2025_-_reviso_tarifria_-_rio_das_pedras.pdf"}, {"name": "ARESPCJ_Resolucao_658_2025_salto", "url": "https://www.arespcj.com.br/public/media/arquivos/1771009406-resoluo_n_658_2025_-_revisotarifria_-_saae_salto_vret.pdf"}, {"name": "ARESPCJ_Resolucao_655_2025_santa-barbara-doeste", "url": "https://www.arespcj.com.br/public/media/arquivos/1758807482-resoluo_arespcj_655_-_reviso_sbo.pdf"}, {"name": "ARESPCJ_Resolucao_721_2026_santa-cruz-das-palmeiras", "url": "https://www.arespcj.com.br/public/media/arquivos/1786120184-resoluo_n_721_2026_-_reajuste_tarifrio_-_santa_cruz_das_palmeiras.pdf"}, {"name": "ARESPCJ_Resolucao_708_2026_vargem-grande-do-sul", "url": "https://www.arespcj.com.br/public/media/arquivos/1782493193-resoluo_n_708_2026_-_reviso_tarifria_-_vargem_grande_do_sul.pdf"}, {"name": "ARESPCJ_Resolucao_710_2026_vinhedo", "url": "https://www.arespcj.com.br/public/media/arquivos/1782828007-resoluo_n_710_2026_-_reviso_tarifria_-_vinhedo.pdf"}, {"name": "ARESPCJ_Resolucao_716_2026_votorantim", "url": "https://www.arespcj.com.br/public/media/arquivos/1785757037-resoluo_n_716_2026_-_reajuste_tarifrio_-_votorantim.pdf"}, {"name": "ARESPCJ_Resolucao_604_2024_jundiai", "url": "https://www.arespcj.com.br/public/media/arquivos/1734981753-resolucao_n_604_2024_-_reviso_tarifaria_-_csj_jundia.pdf"}, {"name": "ARESPCJ_Resolucao_720_2026_piracicaba", "url": "https://www.arespcj.com.br/public/media/arquivos/1785932326-resoluo_n_720_2026_-_reviso_extraordinria_-_piracicaba.pdf"}, {"name": "ARESPCJ_Resolucao_638_2025_piracicaba", "url": "https://www.arespcj.com.br/public/media/arquivos/1753102237-resoluo_n_638_2025_-_reviso_tarifria_-_piracicaba.pdf"}]
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          log=open('fontes/_log.txt','w')
          for it in items:
              ok=False
              for tent in range(3):
                  try:
                      req=urllib.request.Request(it['url'], headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36','Accept':'application/pdf,*/*','Accept-Language':'pt-BR,pt;q=0.9','Referer':'https://www.arespcj.com.br/conteudo/resolucoes-ares-pcj'})
                      data=urllib.request.urlopen(req, timeout=60, context=ctx).read()
                      if data[:4]==b'%PDF':
                          open(f"fontes/{it['name']}.pdf",'wb').write(data); log.write(f"OK {it['name']} {len(data)}\n"); ok=True; break
                      log.write(f"NAO-PDF {it['name']} {data[:200]!r}\n")
                  except Exception as e:
                      log.write(f"ERRO {it['name']} tent{tent} {e!r}\n"); time.sleep(5)
          log.close()
          PY
          ls -la fontes
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add fontes
          git commit -m "PDFs ARES-PCJ (tentativa 2)" || echo nada
          git push
