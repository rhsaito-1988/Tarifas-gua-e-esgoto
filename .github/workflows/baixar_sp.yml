name: baixar-sp-onda12
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar
        run: |
          mkdir -p fontes_sp
          python3 - <<'PY'
          import urllib.request, ssl, time, os, json
          items = [{"name": "SP_3502101_Andradina_tabela_site_x_2026", "url": "https://igua.com.br/storage/16/79/09/historico-das-tarifa-1zxzr.pdf", "ext": "pdf"}, {"name": "SP_3502507_Aparecida_deliberacao_1782_2026", "url": "https://www.arsesp.sp.gov.br/LegislacaoArquivos/DELIBERA%C3%87%C3%83O%20ARSESP%20N%C2%BA%201.782,%20de%2004%20de%20mar%C3%A7o%20de%202026.pdf", "ext": "pdf"}, {"name": "SP_3502804_Araçatuba_resolucao_001_2026", "url": "https://www.samar.eco.br/media/upload/ckeditor/2026/08/06/resolucao-001_2026_O07PRlK.pdf", "ext": "pdf"}, {"name": "SP_3502903_Araçoiaba_da_Serra_resolucao_616_2025", "url": "https://www.arespcj.com.br/public/media/arquivos/1743423403-resoluo_n_616_2025_-_reajuste_tarifrio_-_araoiaba_da_serra.pdf", "ext": "pdf"}, {"name": "SP_3505203_Bariri_decreto_6208_2025", "url": "https://pesquisadeleis.com.br/sp/bariri/legislacao/arquivo/77747/download", "ext": "pdf"}, {"name": "SP_3505906_Batatais_decreto_4739_2026", "url": "https://www.batatais.sp.gov.br/uploads/diarios/1151/diario_202601071745386787260.pdf", "ext": "pdf"}, {"name": "SP_3506102_Bebedouro_decreto_18160_2026", "url": "https://saaebambiental.sp.gov.br/wp-content/uploads/2026/03/Decreto-Reajuste.pdf", "ext": "pdf"}, {"name": "SP_3510005_Cândido_Mota_decreto_7674_2025", "url": "https://www.saaecandidomota.com.br/wp-content/uploads/2026/02/De767425.pdf", "ext": "pdf"}, {"name": "SP_3511409_Cerqueira_César_tabela_site_x_", "url": "https://www.cerqueiracesar.sp.gov.br/public/admin/globalarq/cria/documento-auxiliar/ceeb6db486719dbac6ca769baad8e33c.pdf", "ext": "pdf"}, {"name": "SP_3513405_Cruzeiro_tabela_site_x_", "url": "https://saaecruzeiro.com.br/?link=taxas-e-tarifas", "ext": "html"}, {"name": "SP_3516705_Garça_portaria_5502-2025_2025", "url": "https://www.saaegarca.sp.gov.br/portal/servicos/1054/tarifas-de-agua-e-esgoto/", "ext": "html"}, {"name": "SP_3518206_Guararapes_decreto_4644_2025", "url": "https://pesquisadeleis.com.br/sp/guararapes/legislacao/arquivo/81706/download", "ext": "pdf"}, {"name": "SP_3518404_Guaratinguetá_deliberacao_1773_2026", "url": "https://www.arsesp.sp.gov.br/LegislacaoArquivos/Delibera%C3%A7%C3%A3o-1773.pdf", "ext": "pdf"}, {"name": "SP_3519600_Ibitinga_tabela_site_x_", "url": "https://www.saaeibitinga.sp.gov.br/portal/download/arquivos/KhjA/", "ext": "pdf"}, {"name": "SP_3520103_Igarapava_deliberacao_1705_2025", "url": "https://www.arsesp.sp.gov.br/LegislacaoArquivos/ldl17052025%20(1)%20(1).pdf", "ext": "pdf"}, {"name": "SP_3522703_Itápolis_portaria_643_2026", "url": "https://www.saaeitapolis.sp.gov.br/iframe_servicos_e_valores.html", "ext": "html"}, {"name": "SP_3524402_Jacareí_resolucao_41_2026", "url": "http://srjacarei.sp.gov.br/wp-content/uploads/2026/08/RESOLUCAO-SRJ-No-41.pdf", "ext": "pdf"}, {"name": "SP_3525102_Jardinópolis_decreto_7379-2024_2024", "url": "https://www.dosp.com.br/exibe_do.php?i=NTc0OTc3", "ext": "html"}, {"name": "SP_3525300_Jaú_tabela_site_x_2026", "url": "https://saemja.jau.sp.gov.br/wp-content/uploads/2026/02/TARIFA-VIGENTE2026_page-0001-scaled.jpg", "ext": "bin"}, {"name": "SP_3525706_José_Bonifácio_decreto_3834_2025", "url": "https://www.dosp.com.br/exibe_do.php?i=NzUzNTgw", "ext": "pdf"}, {"name": "SP_3526803_Lençóis_Paulista_decreto_390-2024_2024", "url": "https://www.saaelp.sp.gov.br/public/admin/globalarq/legislacao/arquivo/34a19986a7558bf6336e2d79b41b054f.pdf", "ext": "pdf"}, {"name": "SP_3528403_Mairinque_deliberacao_1787_2026", "url": "https://www.arsesp.sp.gov.br/LegislacaoArquivos/1787.pdf", "ext": "pdf"}, {"name": "SP_3529005_Marília_resolucao_04_2026", "url": "https://ricambiental.com.br/wp-content/uploads/2026/05/domm_-_4141_-_28_02_2026-Ataulizacao-Inflacionaria-pgs06-07.pdf", "ext": "pdf"}, {"name": "SP_3530102_Mirandópolis_decreto_4074_2025", "url": "https://www.mirandopolis.sp.gov.br/portal/leis_decretos/2210/", "ext": "html"}, {"name": "SP_3530300_Mirassol_tabela_site_x_2025", "url": "https://igua.com.br/storage/a8/7f/f6/historico-das-tarifa-cpkka.pdf", "ext": "pdf"}, {"name": "SP_3534708_Ourinhos_tabela_site_x_2025", "url": "https://www.ourinhossaneamento.com.br/legislacao-e-tarifas/", "ext": "html"}, {"name": "SP_3537404_Pereira_Barreto_resolucao_189_2026", "url": "https://saaepereirabarreto.com.br/download/1854/?tmstv=1787750747", "ext": "pdf"}, {"name": "SP_3538907_Pirajuí_tabela_site_TabelaSAAE2024_2024", "url": "https://saaepirajui.sp.gov.br/wp-content/uploads/2024/09/Tabela-Saae-2024.pdf", "ext": "pdf"}, {"name": "SP_3539509_Pitangueiras_decreto_5391_2026", "url": "https://www.dosp.com.br/exibe_do.php?i=NzYxMTI4", "ext": "pdf"}, {"name": "SP_3540200_Pontal_decreto_084-2025_2025", "url": "https://ecrie.com.br/sistema/conteudos/arquivo/a_71_0_3_19122025161102.pdf", "ext": "pdf"}, {"name": "SP_3540705_Porto_Ferreira_tabela_site_x_2025", "url": "https://arpf.sp.gov.br/tarifas/baixar_arquivo/20/Anexo%20I.pdf", "ext": "pdf"}, {"name": "SP_3541505_Presidente_Venceslau_decreto_006_2026", "url": "https://www.dosp.com.br/exibe_do.php?i=NzYxMzg1", "ext": "pdf"}, {"name": "SP_3541604_Promissão_decreto_3808_2024", "url": "https://www.saaepromissao.com.br/portal/download/arquivos/CRTL/", "ext": "pdf"}, {"name": "SP_3546603_Santa_Fé_do_Sul_decreto_6044_2026", "url": "https://www.dosp.com.br/exibe_do.php?i=NzYxNDgw", "ext": "pdf"}, {"name": "SP_3546702_Santa_Gertrudes_deliberacao_1732_2025", "url": "https://www.arsesp.sp.gov.br/LegislacaoArquivos/Delibera%C3%A7%C3%A3o%201732.pdf", "ext": "pdf"}, {"name": "SP_3553401_Tanabi_decreto_5471_2026", "url": "https://www.dosp.com.br/exibe_do.php?i=NzU4OTE4", "ext": "html"}, {"name": "SP_3556305_Valparaíso_resolucao_07-2025_2025", "url": "https://daev.sp.gov.br/pdf/publicacoes/2429100554.pdf", "ext": "pdf"}]
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          log=open('fontes_sp/_log_onda12.txt','w')
          for it in items:
              for tent in range(3):
                  try:
                      req=urllib.request.Request(it['url'], headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36','Accept':'*/*','Accept-Language':'pt-BR,pt;q=0.9'})
                      r=urllib.request.urlopen(req, timeout=90, context=ctx); data=r.read(); ct=r.headers.get('Content-Type','')
                      ext = 'pdf' if data[:4]==b'%PDF' else ('html' if b'<html' in data[:2000].lower() else it['ext'])
                      open(f"fontes_sp/{it['name']}.{ext}",'wb').write(data); log.write(f"OK {it['name']} {ext} {len(data)} {ct}\n"); break
                  except Exception as e:
                      log.write(f"ERRO {it['name']} tent{tent} {e!r}\n"); time.sleep(5)
          log.close()
          PY
          ls -la fontes_sp
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add fontes_sp
          git commit -m "Fontes SP onda 1-2" || echo nada
          git push
